name: Testler

# Her push ve pull request'te pytest calistirir (5.4). windows-latest
# kullanilir cunku program Windows'a ozgu API'lere (win32, WinRT, dxcam)
# dayanir - testler bunlari mock'lasa da, gercek Windows ortaminda
# calistirmak en guvenilir sonucu verir.
on:
  push:
  pull_request:
  workflow_call: {}  # release.yml tarafindan yeniden kullanilabilir (5.4)

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testleri calistir
        run: pytest -q
